name: pihnn-env

channels:
  - conda-forge

dependencies:
  - python==3.12
  - pip
  - pip:
      - torch==2.12.0 --index-url https://download.pytorch.org/whl/cu126
  - conda-build
  - conda-verify
  - sphinx
  - pydata-sphinx-theme
  - sphinx-autoapi
  - sphinxcontrib-youtube
  - tqdm
  - matplotlib>=3.5.0
  - numpy>=1.22.0
  - scipy>=1.9.0